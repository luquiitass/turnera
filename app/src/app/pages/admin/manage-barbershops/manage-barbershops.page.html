<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/platform" text="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>Gestionar Barberias</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="createBarbershop()">
        <ion-icon name="add-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="isLoading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <ion-list *ngIf="!isLoading">
    <ion-item
      *ngFor="let bs of barbershops"
      button
      detail
      (click)="goToDetail(bs)"
      [class.inactive-item]="!bs.isActive">

      <ion-icon
        [name]="bs.isActive ? 'storefront-outline' : 'storefront-outline'"
        slot="start"
        [color]="bs.isActive ? 'primary' : 'medium'">
      </ion-icon>

      <ion-label>
        <h2 [style.opacity]="bs.isActive ? 1 : 0.5">{{ bs.name }}</h2>
        <p>{{ bs.address }}</p>
        <p *ngIf="bs.phone">{{ bs.phone }}</p>
        <p *ngIf="bs.admins && bs.admins.length > 0" class="admins-list">
          <ion-icon name="shield-checkmark-outline" size="small" color="primary"></ion-icon>
          <span class="admin-names">
            <span *ngFor="let admin of bs.admins; let last = last">
              {{ admin.user?.firstName }} {{ admin.user?.lastName }}<span *ngIf="!last">, </span>
            </span>
          </span>
        </p>
      </ion-label>

      <div slot="end" class="end-slot">
        <ion-chip [color]="bs.isActive ? 'success' : 'danger'" outline class="status-chip">
          <ion-label>{{ bs.isActive ? 'Activa' : 'Inactiva' }}</ion-label>
        </ion-chip>

        <ion-button
          fill="clear"
          [color]="bs.isActive ? 'danger' : 'success'"
          size="small"
          class="toggle-btn"
          [disabled]="togglingId === bs.id"
          (click)="toggleActive($event, bs)">
          <ion-spinner *ngIf="togglingId === bs.id" name="crescent" slot="icon-only" style="width:18px;height:18px"></ion-spinner>
          <ion-icon
            *ngIf="togglingId !== bs.id"
            [name]="bs.isActive ? 'eye-off-outline' : 'eye-outline'"
            slot="icon-only">
          </ion-icon>
        </ion-button>
      </div>

    </ion-item>
  </ion-list>

  <div *ngIf="!isLoading && barbershops.length === 0" class="ion-text-center ion-padding">
    <ion-icon name="storefront-outline" style="font-size: 64px;" color="medium"></ion-icon>
    <h3>No hay barberias registradas</h3>
    <ion-button fill="outline" (click)="createBarbershop()">Crear primera barberia</ion-button>
  </div>

</ion-content>
