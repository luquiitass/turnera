<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" text="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ profileComponent?.barbershop?.name || 'Detalle de Barbería' }}</ion-title>
    <ion-buttons slot="end" *ngIf="profileComponent?.isAdmin">
      <ion-button (click)="profileComponent!.showAdminPanel = true">
        <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-barbershop-profile
    #profileComponent
    [barbershopId]="barbershopId!"
    [embedded]="true">
  </app-barbershop-profile>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed"
           *ngIf="profileComponent?.barbershop && !profileComponent?.isLoading">
    <ion-fab-button color="primary" (click)="profileComponent!.navigateToBooking()">
      <ion-icon name="calendar-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <div class="fab-label"
       *ngIf="profileComponent?.barbershop && !profileComponent?.isLoading"
       (click)="profileComponent!.navigateToBooking()">
    Reservar
  </div>
</ion-content>
