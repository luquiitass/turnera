<ion-tabs>
  <ion-tab-bar slot="bottom">

    <ion-tab-button tab="home">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="barbershops">
      <ion-icon name="storefront-outline"></ion-icon>
      <ion-label>Barberías</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="users">
      <ion-icon name="people-outline"></ion-icon>
      <ion-label>Usuarios</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="notifications" class="notif-tab">
      <ion-icon name="notifications-outline"></ion-icon>
      <ion-badge *ngIf="(notificationsService.unreadCount$ | async) as count" color="danger">{{ count > 99 ? '99+' : count }}</ion-badge>
      <ion-label>Avisos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>

    <ion-tab-button *ngIf="hasMultipleRoles" (click)="openRoleSwitcher()">
      <ion-icon name="swap-horizontal-outline"></ion-icon>
      <ion-label>Rol</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
