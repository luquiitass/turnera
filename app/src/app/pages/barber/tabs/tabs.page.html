<ion-tabs>
  <ion-tab-bar slot="top">

    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="bookings">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Agenda</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="notifications" class="notif-tab">
      <ion-icon name="notifications-outline"></ion-icon>
      <ion-badge *ngIf="(notificationsService.unreadCount$ | async) as count" color="danger">{{ count > 99 ? '99+' : count }}</ion-badge>
      <ion-label>Avisos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="openRoleSwitcher()">
      <ion-icon name="swap-horizontal-outline"></ion-icon>
      <ion-label>Rol</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
